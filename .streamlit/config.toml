# 3dflowhub 현황판 테마 — 게시판 사이트(디자인 v3: 징크 뉴트럴 + 레드 포인트)와 같은 톤. 라이트/다크는 시스템 설정을 따름
[theme]
primaryColor = "#FD3A25"
baseRadius = "1rem"
buttonRadius = "full"
showWidgetBorder = false

[theme.light]
primaryColor = "#FD3A25"
backgroundColor = "#EDECEC"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#09090B"

[theme.dark]
primaryColor = "#FF3B26"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#FAFAFA"

[browser]
gatherUsageStats = false

[server]
headless = true
