name: 3dflowhub pages

# content/posts/*.json → 정적 사이트(_site) → GitHub Pages 배포
# 수집 워크플로가 새 글을 커밋한 뒤 이 워크플로를 호출한다 (GITHUB_TOKEN push 는 push 트리거를 일으키지 않으므로)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "build_site.py", "compare.py", "manual.py", "visuals.py", "rag.py", "check_links.py", "static/**", "config.json", "memory/curation.json", "memory/tips.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_site.py
      - name: SEO 구조 점검 (중복 제목·설명·h1, 사이트맵 누락, 고아 페이지) — 문제는 경고로 표시
        run: |
          python seo_audit.py > seo.json
          python -c "import json; d=json.load(open('seo.json',encoding='utf-8')); bad={k:d[k] for k in ('dup_title_count','dup_desc_count','dup_h1_count','not_in_sitemap_count','orphan_count') if d[k]}; print('::warning::SEO 점검 문제 '+json.dumps(bad,ensure_ascii=False) if bad else 'SEO 점검 통과')"
      - name: Check internal links
        run: python check_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Notify search engines (IndexNow → Naver, Bing, Yandex, Seznam, Yep)
        run: python build_site.py --indexnow || true
