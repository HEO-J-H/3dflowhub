name: 3dflowhub pages

# content/posts/*.json → 정적 사이트(_site) → GitHub Pages 배포
# 수집 워크플로가 새 글을 커밋한 뒤 이 워크플로를 호출한다 (GITHUB_TOKEN push 는 push 트리거를 일으키지 않으므로)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "build_site.py", "static/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
