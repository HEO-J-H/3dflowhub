name: 3dflowhub auto curation

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # 10분 간격(정각 혼잡 회피), 실제 실행은 config.json 주기로 판단
  workflow_dispatch:
    inputs:
      max_items:
        description: "최대 수집 개수 (비우면 config.json)"
        required: false
      domains:
        description: "도메인 (콤마 구분, 비우면 config.json)"
        required: false
      publish:
        description: "티스토리 발행"
        type: boolean
        default: true
      scheduled:
        description: "heartbeat 호출 (config.json 주기 확인 후 실행)"
        type: boolean
        default: false

permissions:
  contents: write   # memory/ 변경 커밋
  actions: write    # pages 워크플로 호출

concurrency:
  group: repo-writes   # self_improve 와 같은 그룹 → main 에 동시에 push 하지 않음
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest
      - name: Korean font (홍보 이미지 렌더용)
        run: sudo apt-get install -y -qq fonts-nanum >/dev/null || true

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: hjh1014
          TISTORY_CATEGORY_MAP: ${{ vars.TISTORY_CATEGORY_MAP }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          IN_MAX: ${{ inputs.max_items }}
          IN_DOMAINS: ${{ inputs.domains }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_SCHEDULED: ${{ inputs.scheduled }}
        run: |
          if [ "$IN_SCHEDULED" = "true" ]; then
            python core.py --scheduled
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$IN_MAX" ] || [ -n "$IN_DOMAINS" ]; then
              ARGS=""
              [ -n "$IN_MAX" ] && ARGS="$ARGS --max-items $IN_MAX"
              [ "$IN_PUBLISH" = "false" ] && ARGS="$ARGS --no-publish"
              python core.py $ARGS --domains "$IN_DOMAINS"
            else
              python core.py --force
            fi
          else
            python core.py --scheduled
          fi

      - name: Upload Tistory drafts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tistory-drafts
          path: drafts/*.html
          if-no-files-found: ignore

      - name: Telegram — receive phone decisions, send new PRs/proposals/alerts, morning summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python notify.py || true

      - name: FSS key type check (once)
        if: always()
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fss.py || true

      - name: Apply PR decisions from the dashboard (Pix2Poly)
        id: decisions
        if: always()
        env:
          PIX2POLY_TOKEN: ${{ secrets.PIX2POLY_TOKEN }}
        run: python agents.py --apply-decisions pix2poly || true

      - name: Rework requested → run coding agents now
        if: always() && steps.decisions.outputs.run_agents == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run self_improve.yml --ref main || true

      - name: Commit memory & drafts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "3dflowhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 원격 최신본 위에 memory JSON 을 내용 병합해 커밋·푸시 (동시 실행 변경 보존), 새 글이 있으면 Pages 재배포
          CHANGED=$(python -c "import core; print(core.ci_commit(['memory/', 'drafts/', 'content/'], 'chore(memory): run $(date -u +%FT%TZ) [skip ci]'))")
          echo "content changed: $CHANGED"
          if [ "$CHANGED" = "True" ]; then gh workflow run pages.yml --ref main; fi
