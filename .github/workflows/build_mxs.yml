name: build mxs checker

# MAXScript 문법 검사기(tools/mxs/mxs_check.cjs)를 다시 만든다. 검사기 소스·빌드 스크립트가 바뀌면 자동 실행.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/mxs/check.ts", "tools/mxs/build.sh"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash tools/mxs/build.sh
      - name: Commit bundle
        run: |
          git config user.name "3dflowhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/mxs/mxs_check.cjs tools/mxs/LICENSE-vscode-maxscript-lsp
          git diff --cached --quiet || git commit -m "chore(tools): MAXScript 문법 검사기 번들 갱신 [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main
