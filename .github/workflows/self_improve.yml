name: 3dflowhub self improve (4 agents)

on:
  schedule:
    - cron: "19 18 * * *"   # 매일 03:19 KST (Gemini 무료 한도 보호를 위해 하루 1회)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Configure git
        run: |
          git config user.name "3dflowhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Coder → Reviewer → QA → Judge (max 3 iterations)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents.py

      - name: Pix2Poly — same 4 agents on the other repo (low-risk auto-merge, core changes as PR)
        if: always()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PIX2POLY_TOKEN: ${{ secrets.PIX2POLY_TOKEN }}
          AGENT_TASKS_PER_RUN: "1"
        run: |
          git checkout main 2>/dev/null || true
          python agents.py --target pix2poly

      - name: Save memory/TODO on main
        if: always()
        run: |
          git checkout main 2>/dev/null || true
          python -c "import core; core.ci_commit(['memory/', 'TODO.md'], 'chore(agents): record result [skip ci]')"
