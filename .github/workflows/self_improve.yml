name: 3dflowhub self improve (4 agents)

on:
  schedule:
    - cron: "19 18 * * *"   # 매일 03:19 KST (Gemini 무료 한도 보호를 위해 하루 1회)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Configure git
        run: |
          git config user.name "3dflowhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Coder → Reviewer → QA → Judge (max 3 iterations)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents.py

      - name: Save memory/TODO when not merged
        run: |
          if [ "$(git branch --show-current)" = "main" ]; then
            git add memory/ TODO.md
            git diff --cached --quiet || (git commit -m "chore(agents): record result [skip ci]" && git push)
          fi
