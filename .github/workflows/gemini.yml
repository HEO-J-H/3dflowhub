name: Gemini AI Automation

on:
  workflow_dispatch:  # 깃허브 웹에서 수동으로 실행할 수 있게 해주는 옵션 (키 동작 확인용)
  # push 마다 실행하면 하루 수십 번 AI 한도를 씀 → 수동 실행만 (본 수집·작성은 core.py 의 예비 공급자 gemini2 로 사용)

jobs:
  gemini-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai python-dotenv

      - name: Run Gemini script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/gemini_script.py
